services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: hitl
      POSTGRES_PASSWORD: hitl
      POSTGRES_DB: hitl_ops
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hitl -d hitl_ops"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: .
    environment:
      APP_ENV: development
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+asyncpg://hitl:hitl@db:5432/hitl_ops
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  bootstrap:
    build: .
    environment:
      APP_ENV: development
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+asyncpg://hitl:hitl@db:5432/hitl_ops
    command: ["python", "-m", "hitl_ops.bootstrap"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  app:
    build: .
    environment:
      APP_ENV: development
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+asyncpg://hitl:hitl@db:5432/hitl_ops
      IDENTITY_SHARED_SECRET: learning-demo-identity-secret-32-bytes-minimum
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      bootstrap:
        condition: service_completed_successfully

  worker:
    build: .
    environment:
      APP_ENV: development
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+asyncpg://hitl:hitl@db:5432/hitl_ops
      WORKER_TICK_INTERVAL_SECONDS: "5"
      WORKER_MAX_BACKOFF_SECONDS: "60"
    # The tick loop supervises its own failures; this is the backstop for a
    # fatal startup error or an OOM kill, so the worker does not stay down.
    restart: unless-stopped
    command: ["python", "-m", "hitl_ops.worker_main"]
    depends_on:
      bootstrap:
        condition: service_completed_successfully
